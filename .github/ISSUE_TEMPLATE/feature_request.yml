name: Feature Request
description: Suggest an idea or platform integration for n8n Social OmniFlow
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to n8n Social OmniFlow!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target Platform or Component
      options:
        - TikTok
        - YouTube Shorts
        - Instagram Reels
        - Pinterest / Threads / X / LinkedIn
        - Visual Studio & Simulator
        - Analytics Dashboard
    validations:
      required: true
